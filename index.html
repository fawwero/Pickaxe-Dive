<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pickaxe Dive</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#14110f;--panel:#241c16;--edge:#6b5440;--fg:#f3e9d8;--mut:#a8957b;--acc:#f2c14e;--ok:#7bd05a;--bad:#e5533d;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:radial-gradient(130% 100% at 50% 0%,#2a1f14 0%,#17110c 55%,#0a0705 100%);color:var(--fg);font-family:'Press Start 2P',ui-monospace,monospace;overflow:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.5;background-image:radial-gradient(rgba(255,220,150,.05) 1px,transparent 1px);background-size:26px 26px}
#wrap{position:relative;height:100%;aspect-ratio:9/16;max-width:100%;margin:0 auto}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none;background:#1b1613}
#ui{position:absolute;inset:0;display:none;overflow-y:auto;padding:14px 12px 24px;background:linear-gradient(#1f1710,#0d0907);font-size:9px;line-height:1.6;scrollbar-width:thin;scrollbar-color:var(--edge) transparent}
#ui::-webkit-scrollbar{width:8px}
#ui::-webkit-scrollbar-thumb{background:var(--edge);border-radius:4px}
#ui::-webkit-scrollbar-track{background:transparent}
#ui h1{font-size:15px;margin:4px 0 6px;color:var(--acc)}
#ui h2{font-size:10px;margin:16px 0 6px;color:var(--mut)}
.row{display:flex;align-items:center;gap:10px;background:linear-gradient(#2c231b,#211a14);border:2px solid var(--edge);border-radius:8px;padding:11px 10px;margin-bottom:7px;animation:pop .28s both}
.row small{color:var(--mut);font-size:7px;display:block}
.btn{font:inherit;font-size:9px;color:#1b1208;background:var(--acc);border:0;border-bottom:4px solid #9a7314;padding:11px 12px;border-radius:6px;cursor:pointer;white-space:nowrap}
.btn:disabled{background:#4a3f33;color:#8a7a66;border-color:#2d251d;cursor:default}
.btn:focus-visible{outline:3px solid #fff}
.go{display:block;width:100%;font-size:12px;padding:12px;margin:10px 0}
.perk{display:block;width:100%;text-align:left;color:var(--fg);background:var(--panel);border:2px solid var(--acc);padding:12px;margin-bottom:8px;font:inherit;font-size:9px;line-height:1.6;cursor:pointer}
.ok{color:var(--ok)}
.perk{animation:pop .28s both;border-radius:8px}
.ic{width:26px;height:26px;display:grid;place-items:center;font-size:15px;flex:none;border-radius:6px;background:#3a2e24}
.ic.sp{width:18px;height:18px;margin:4px}
.sel{border-color:var(--acc)}
.sel .ic.sp,.row:hover .ic.sp{animation:spin 1s linear infinite}
.bar{display:block;height:5px;background:#120e0b;margin-top:5px;border-radius:3px;overflow:hidden}
.bar b{display:block;height:100%;background:var(--ok)}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(6px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
.wh{position:relative;width:210px;height:210px;margin:18px auto}
.wheel{width:100%;height:100%;border-radius:50%;border:4px solid #f3e9d8;box-sizing:border-box}
.ptr{position:absolute;left:50%;top:-12px;margin-left:-10px;border:10px solid transparent;border-top:18px solid #ffd84a}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
/* ===== ПК: рамка вокруг игры, крупнее UI ===== */
@media (min-width:760px){
  #wrap{height:min(100vh - 64px,940px);margin:32px auto;border-radius:14px;overflow:hidden;box-shadow:0 0 0 3px #0a0705,0 0 0 6px var(--edge),0 0 0 8px #2d2218,0 34px 90px rgba(0,0,0,.65)}
  #ui{font-size:11px;padding:22px 20px 36px;line-height:1.7}
  #ui h1{font-size:20px;margin:6px 0 10px;text-shadow:2px 2px 0 #000}
  #ui h2{font-size:12px;margin:22px 0 8px}
  .row{padding:13px 12px;margin-bottom:9px;border-radius:10px}
  .row small{font-size:8px}
  .btn{font-size:11px;padding:13px 14px;border-bottom-width:5px}
  .go{font-size:15px;padding:15px;margin:14px 0}
  .perk{font-size:11px;padding:15px}
  .ic{width:34px;height:34px;font-size:19px;border-radius:8px}
  .ic.sp{width:26px;height:26px;margin:4px}
  .wh{width:250px;height:250px;margin:24px auto}
}
@media (min-width:760px) and (max-height:700px){
  #wrap{height:calc(100vh - 32px);margin:16px auto}
}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas><div id="ui"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
(() => {
'use strict';
const { Engine, World, Bodies, Body, Events } = Matter;

/* ===================== storage.js ===================== */
const KEY = 'pickaxeDive_v1';
const DEF = { coins: 0, up: { dmg: 0, hp: 0, luck: 0, mag: 0 }, skin: 'silver', skins: ['silver'], perks: [], deep: 0, best: 0, inv: [], eq: [] };
let S = (() => {
  try { const s = JSON.parse(localStorage.getItem(KEY) || '{}'); return Object.assign({}, DEF, s, { up: Object.assign({}, DEF.up, s.up) }); }
  catch (e) { return JSON.parse(JSON.stringify(DEF)); }
})();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const MIG = { wood: 'silver', plasma: 'ender' }; // миграция старых скинов
S.skin = MIG[S.skin] || S.skin; S.skins = [...new Set(S.skins.map(k => MIG[k] || k))]; if (!S.skins.includes('silver')) S.skins.push('silver');

/* ===================== config ===================== */
const W = 360, H = 640, CELL = 40, COLS = 9, ROWS = 50, TOP = 100, WORLD_H = TOP + ROWS * CELL;
const STEP = 1000 / 60;
const T = {
  stone:   { hp: [100, 300],  col: '#7d7d85', dot: '#5b5b63', coin: [2, 5] },
  coal:    { hp: [500, 1500], col: '#3b3b42', dot: '#111114', coin: [8, 18] },
  ice:     { hp: [200, 400],  col: '#9fdcf2', dot: '#eafcff', coin: [3, 6], rest: 1.0 },
  diamond: { hp: [800, 1200], col: '#2fb9b0', dot: '#b8fff6', coin: [40, 60] },
  tnt:     { hp: [1, 1],      col: '#c8402e', dot: '#fff',    coin: [0, 0] },
  bench:   { hp: [1, 1],      col: '#a8743c', dot: '#6d4a22', coin: [0, 0] },
  spring:  { hp: [600, 600],  col: '#3fae5a', dot: '#b8ff9a', coin: [0, 0] },
  mud:     { hp: [60, 120],   col: '#5a4126', dot: '#3a2815', coin: [1, 2] },
  goldore: { hp: [900, 1500], col: '#8a6b1f', dot: '#ffd84a', coin: [25, 45] },
  lava:    { hp: [400, 700],  col: '#c2451c', dot: '#ffb347', coin: [0, 0] },
  spike:   { hp: [150, 250],  col: '#8a2c2c', dot: '#ffb3b3', coin: [3, 6] },
  crystal: { hp: [150, 250],  col: '#b55cff', dot: '#f0d0ff', coin: [10, 20] },
  chest:   { hp: [1, 1],      col: '#8a5a2b', dot: '#ffd84a', coin: [0, 0] }
};
const BIOMES = [
  { name: 'Пещера',  bg: '#1b1613', gap: .24, coal: .12, ice: .04 },
  { name: 'Ледник',  bg: '#10202a', gap: .22, coal: .06, ice: .32 },
  { name: 'Рудник',  bg: '#1d1410', gap: .20, coal: .30, ice: .02 }
];
const SKINS_OLD = {
  wood:    { n: 'Деревянная', head: '#c9c9c9', price: 0,    info: 'без бонусов',          dmg: 1,   coin: 1 },
  gold:    { n: 'Золотая',    head: '#f2c14e', price: 400,  info: '+15% монет, магнит x1.6',           dmg: 1,   coin: 1.15 },
  diamond: { n: 'Алмазная',   head: '#4be0d4', price: 1200, info: '+20% урона, шипы вдвое слабее',           dmg: 1.2, coin: 1 },
  plasma:  { n: 'Плазменная', head: '#c46bff', price: 3000, info: '+30% урона, +10% монет, упругая (отскок .92)', dmg: 1.3, coin: 1.1 }
};
const SKINS = {
  silver:   { n: 'Серебряная',  head: '#d5dbe3', price: 0,    info: 'без бонусов', dmg: 1, coin: 1 },
  gold:     { n: 'Золотая',     head: '#f2c14e', price: 400,  info: '+15% монет, магнит x1.6', dmg: 1, coin: 1.15, mag: 1.6 },
  lazurite: { n: 'Лазуритовая',  head: '#3d63d8', price: 800,  info: '+10% урона, упругая (.85)', dmg: 1.1, coin: 1, rest: .85 },
  rubine:   { n: 'Рубиновая',   head: '#e0364a', price: 1300, info: '+25% урона', dmg: 1.25, coin: 1 },
  izumrud:  { n: 'Изумрудная',  head: '#3ddc84', price: 2000, info: '+20% монет, +5% крита', dmg: 1, coin: 1.2, crit: .05 },
  diamond:  { n: 'Алмазная',    head: '#4be0d4', price: 3000, info: '+20% урона, шипы вдвое слабее', dmg: 1.2, coin: 1, spike: .5 },
  ender:    { n: 'Эндер',        head: '#b04cff', price: 5000, info: '+30% урона, +10% монет, упругая (.92)', dmg: 1.3, coin: 1.1, rest: .92 }
};
// Текстуры 13x13 лежат рядом с HTML (Название_PA.png). Если файла нет — рисуется упрощённая кирка цветом скина.
const PA = { silver: 'Silver', gold: 'Gold', lazurite: 'Lazurite', rubine: 'Rubine', izumrud: 'Izumrud', diamond: 'Diamond', ender: 'Ender' };
const IMG = {};
for (const k in PA) {
  const im = new Image();
  im.onload = () => { IMG[k] = im; if (state === 'hub' && ui.style.display !== 'none') showHub(); }; // обновить хаб, когда текстура догрузилась
  im.src = PA[k] + '_PA.png';
}
const UPS = {
  dmg:  { n: 'Сила кирки', d: '+25% урона', base: 30, k: 1.6, max: 15 },
  hp:   { n: 'Прочность',  d: '+25 макс. HP', base: 25, k: 1.55, max: 15 },
  luck: { n: 'Удача',      d: 'крит и алмазы', base: 60, k: 1.8, max: 8 },
  mag:  { n: 'Магнит руды', d: 'радиус сбора', base: 40, k: 1.7, max: 6 }
};
const PERKS = [
  { id: 'mini',  n: 'Каждый 5-й удар вызывает мини-взрыв' },
  { id: 'vamp',  n: 'Вампиризм: +1 HP за каждые 10 блоков' },
  { id: 'rich',  n: 'Золотая лихорадка: монеты x1.25' },
  { id: 'crit',  n: 'Меткий глаз: +10% к шансу крита' },
  { id: 'tough', n: 'Закалка: каждый удар стоит на 1 HP меньше' },
  { id: 'shield', n: 'Щит: 2 секунды неуязвимости после взрыва TNT' },
  { id: 'berserk', n: 'Берсерк: урон x1.5, когда HP ниже 30%' },
  { id: 'triple', n: 'Добивание: каждый 3-й удар по блоку x2.5' }
];
const has = id => S.perks.includes(id);
const rnd = (a, b) => a + Math.random() * (b - a);
const cost = k => Math.round(UPS[k].base * Math.pow(UPS[k].k, S.up[k]));
const maxHp = () => 100 + 25 * S.up.hp;
const dmgBase = () => 60 * (1 + .25 * S.up.dmg) * SKINS[S.skin].dmg * (has('mini') ? 1 : 1);
const coinMul = () => SKINS[S.skin].coin * (has('rich') ? 1.25 : 1);

/* ===================== physics.js ===================== */
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
cv.width = W; cv.height = H;
const engine = Engine.create();
engine.gravity.y = 1.6;                       // гравитация
const GACC = .001 * engine.gravity.y * STEP * STEP; // ускорение (px/шаг^2) для прицела
let gen, pick, run, bio = BIOMES[0], state = 'hub', aim = null, firstTry = true;
const cam = { y: 0, z: 1, zt: 1 }, shk = { m: 0, x: 0, y: 0 };
let fx = [], txt = [];

function makePick() {
  pick = Bodies.circle(W / 2, 50, 9, { restitution: SKINS[S.skin].rest || .8, friction: 0, frictionStatic: 0, frictionAir: .0004, density: .002, label: 'pick', isStatic: true });
  World.add(engine.world, pick);
}

const ZONES = ['Верхние слои', 'Средние слои: грязь и пружины', 'Глубины: шипы и динамит'];
const zoneOf = r => r < 16 ? 0 : r < 33 ? 1 : 2;
const UI_IC = { dmg: '⛏', hp: '❤', luck: '🍀', mag: '🧲' };
/* ===================== generator.js ===================== */
function newRun() {
  World.clear(engine.world, false);
  bio = BIOMES[Math.floor(Math.random() * BIOMES.length)];
  const wall = (x, y, w, h) => Bodies.rectangle(x, y, w, h, { isStatic: true, restitution: .8, friction: 0, label: 'wall' });
  World.add(engine.world, [wall(-25, 100000, 50, 200000), wall(W + 25, 100000, 50, 200000), wall(W / 2, -25, W + 100, 50)]);
  gen = (from, to) => {
  const blocks = [];
  for (let r = from; r < to; r++) {
    const bc = (r % 8 === 6) ? Math.floor(Math.random() * COLS) : -1;
    for (let c = 0; c < COLS; c++) {
      let type = null;
      if (c === bc || (r % 50 === 0 && c === 4)) type = 'bench';
      else if (r % 50 === 0 && (c === 1 || c === 7)) type = 'crystal';
      else if (Math.random() >= bio.gap) {
        const q = Math.random();
        const z = zoneOf(r), q2 = Math.random();
        if (r > 8 && q < (.012 + .008 * S.up.luck) * (1 + z)) type = 'diamond';
        else if (q < .08 + .03 * z) type = 'tnt';
        else if (z >= 1 && q2 < .05) type = 'spring';
        else if (z >= 1 && q2 < .12) type = 'mud';
        else if (r > 8 && q2 > .953 && q2 <= .96) type = 'chest';
        else if (r > 5 && q2 > .96) type = 'crystal';
        else if (z >= 2 && q2 > .86) type = 'spike';
        else if (q < .08 + bio.coal) type = 'coal';
        else if (q < .08 + bio.coal + bio.ice) type = 'ice';
        else type = 'stone';
      }
      if (!type) continue;
      const t = T[type], hp = rnd(t.hp[0], t.hp[1]) * (1 + Math.min(r / ROWS, 3) * .8);
      const b = { type, r, c, x: c * CELL + CELL / 2, y: TOP + r * CELL + CELL / 2, hp, max: hp, flash: 0,
        sp: Array.from({ length: 4 }, () => [rnd(3, 32) | 0, rnd(3, 32) | 0, rnd(3, 6) | 0]) };
      b.body = Bodies.rectangle(b.x, b.y, CELL, CELL, { isStatic: true, friction: 0, restitution: t.rest || .5, label: 'block' });
      b.body.blk = b; blocks.push(b);
    }
  }
  World.add(engine.world, blocks.map(b => b.body)); run.blocks.push(...blocks); run.rows = to;
  };
  makePick();
  const mh = maxHp();
  run = { hp: mh, max: mh, coins: 0, hits: 0, broken: 0, depth: 0, still: 0, blocks: [], pk: [], fuse: [], after: [], t: 0, rows: 2, spells: S.eq.map(u => S.inv.find(i => i.uid === u)).filter(Boolean).map(i => ({ id: i.id, r: i.r, cd: 0, max: 1, uid: i.uid })), gacha: null, fxs: null };
  gen(2, 34);
  cam.y = 0; cam.z = cam.zt = 1; fx = []; txt = [];
}

/* ===================== game.js: события ===================== */
Events.on(engine, 'collisionStart', e => {
  if (!run || state !== 'fly') return;
  for (const p of e.pairs) {
    const o = p.bodyA === pick ? p.bodyB : p.bodyB === pick ? p.bodyA : null;
    if (o && o.blk) hit(o.blk);
  }
});

function hit(b) {
  if (b.type === 'tnt') return explode(b);
  if (b.type === 'bench') return bench(b);
  if (b.type === 'chest') return openChest(b);
  if (b.type === 'spring') {
    const dx = pick.position.x - b.x, dy = pick.position.y - b.y, d = Math.hypot(dx, dy) || 1;
    run.after.push(() => Body.setVelocity(pick, { x: dx / d * 14, y: dy / d * 14 - 5 }));
    b.flash = 1; float(b.x, b.y - 18, 'БОИНГ!', '#b8ff9a', 9); burst(b.x, b.y, '#b8ff9a', 8, 4); shake(3); return;
  }
  run.hits++;
  const spd = Math.max(.6, Math.min(1.8, pick.speed / 10));
  const crit = Math.random() < .05 + .03 * S.up.luck + (has('crit') ? .1 : 0) + (SKINS[S.skin].crit || 0);
  b.n = (b.n || 0) + 1;
  const tri = has('triple') && b.n % 3 === 0;
  const mul = (crit ? 2 : 1) * (tri ? 2.5 : 1) * (has('berserk') && run.hp < run.max * .3 ? 1.5 : 1) * (run.buff && run.buff.k === 'dmg' ? 2 : 1);
  damage(b, dmgBase() * spd * mul, crit || tri);
  if (b.type === 'mud') run.after.push(() => Body.setVelocity(pick, { x: pick.velocity.x * .4, y: pick.velocity.y * .4 }));
  let loss = Math.max(1, Math.round(1 + b.max / 180));
  if (has('tough')) loss = Math.max(1, loss - 1);
  if (b.type === 'mud') loss = 0;
  if (b.type === 'spike') loss = Math.round(8 * (SKINS[S.skin].spike || 1));
  loseHp(loss);
  burst(pick.position.x, pick.position.y, b.type === 'ice' ? '#d8f6ff' : '#ffd36b', 4, 3); // искры
  shake(Math.min(6, pick.speed / 3));
  if (has('mini') && run.hits % 5 === 0) explode(b, true);
}
function damage(b, d, crit) {
  if (!b.body) return;
  b.hp -= d; b.flash = 1;
  float(b.x + rnd(-8, 8), b.y - 12, Math.round(d), crit ? '#ff9f2e' : '#ffe066', crit ? 12 : 9);
  if (b.hp <= 0) destroy(b);
}
function destroy(b) {
  if (!b.body) return;
  World.remove(engine.world, b.body); b.body = null; run.broken++;
  burst(b.x, b.y, T[b.type].col, 10, 4);
  if (b.type === 'crystal') crystalBuff();
  const c = T[b.type].coin;
  if (c[1] > 0) run.pk.push({ x: b.x, y: b.y, v: Math.max(1, Math.round(rnd(c[0], c[1]) * coinMul() * (run.buff && run.buff.k === 'gold' ? 2 : 1))), ph: Math.random() * 6 });
  if (has('vamp') && run.broken % 10 === 0) { run.hp = Math.min(run.max, run.hp + 1); float(pick.position.x, pick.position.y - 14, '+1 HP', '#ff7a7a', 9); }
}
function loseHp(n) {
  if (n <= 0) return;
  if (run.shield > 0) { float(pick.position.x, pick.position.y - 12, 'БЛОК', '#9fdcf2', 9); return; }
  run.hp -= n; float(pick.position.x + 10, pick.position.y - 10, '-' + n, '#ff5a4a', 9);
  if (run.hp <= 0) { run.hp = 0; endRun(); }
}
function bench(b) {
  if (b.used) return;
  b.used = true;
  run.max += 10; run.hp = Math.min(run.max, run.hp + Math.ceil(run.max * .4));
  float(b.x, b.y - 18, 'РЕМОНТ! +10 MAX', '#7bd05a', 9);
  burst(b.x, b.y, '#7bd05a', 14, 4);
  run.after.push(() => Body.setVelocity(pick, { x: pick.velocity.x * .6, y: -15 })); // стрелка вверх подбрасывает
}
function explode(b, mini) {
  const R = mini ? 75 : 105, D = mini ? 260 : 520, cx = b.x, cy = b.y;
  if (!mini) destroy(b);
  for (const o of run.blocks) {
    if (!o.body || o === b) continue;
    const d = Math.hypot(o.x - cx, o.y - cy);
    if (d > R) continue;
    if (o.type === 'tnt') { if (!o.fuse) { o.fuse = 1; run.fuse.push({ b: o, t: .12 }); } }
    else if (o.type !== 'bench') damage(o, D * (1 - d / R * .5));
  }
  const dx = pick.position.x - cx, dy = pick.position.y - cy, d = Math.hypot(dx, dy) || 1;
  if (d < R * 1.4) { const k = (mini ? 5 : 10) * (1 - d / (R * 1.6)); run.after.push(() => Body.setVelocity(pick, { x: pick.velocity.x + dx / d * k, y: pick.velocity.y + dy / d * k })); }
  burst(cx, cy, '#ff9a2e', mini ? 14 : 30, 7); burst(cx, cy, '#fff2a8', mini ? 6 : 12, 5);
  fx.push({ ring: 1, x: cx, y: cy, r: 6, life: .35, max: .35 });
  if (has('shield') && !mini) run.shield = 2;
  shake(mini ? 5 : 14); cam.zt = mini ? 1.04 : 1.12;
}

/* ===== сундуки и магии ===== */
const RAR = [{ n: 'ОБЫЧНАЯ', c: '#b9c4cf', m: 1 }, { n: 'РЕДКАЯ', c: '#5aa8ff', m: 1.5 }, { n: 'ЭПИЧЕСКАЯ', c: '#c46bff', m: 2.2 }];
const SPELLS = {
  vortex: { n: 'Вихрь', ic: '🌀', cd: 8 },
  aegis:  { n: 'Эгида', ic: '🛡', cd: 11 },
  storm:  { n: 'Магнит-шторм', ic: '🧲', cd: 12 },
  drill:  { n: 'Бур', ic: '⬇', cd: 6 }
};
function openChest(b) {
  if (b.opened) return;
  b.opened = true; b.t0 = performance.now();
  burst(b.x, b.y, '#ffd84a', 22, 6); shake(4);

let vig, vigRed, grainCv, zflash = 0;
const GLOW = { crystal: 'rgba(224,168,255,A)', diamond: 'rgba(120,255,240,A)', spring: 'rgba(184,255,154,A)', chest: 'rgba(255,216,74,A)' };
const TINTS = [[0, 255, 170, 90, .1], [20, 60, 45, 30, .32], [45, 40, 90, 210, .24]]; // тёплый верх, тусклая середина, холодные глубины

}
